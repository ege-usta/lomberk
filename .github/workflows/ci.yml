name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.1

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Pytest
        env:
          # AI/LLM calls are bypassed inside tests using monkeypatch, ensuring isolation.
          # We use testcontainers to spin up fresh ephemeral databases for integration tests.
          PYTHONPATH: src
        run: |
          uv run --no-sync pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test-results/junit.xml \
            --strict-markers

      - name: Build container image
        run: docker build -t undogate:ci .

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: pytest-results
          path: test-results/junit.xml
          retention-days: 7
