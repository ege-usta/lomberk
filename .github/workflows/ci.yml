name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Pytest
        env:
          # OPENAI_API_KEY is never set here, so the optional LLM sentinel stays off; tests that cover it mock the call.
          # We use testcontainers to spin up fresh ephemeral databases for integration tests.
          PYTHONPATH: src
          ROWBACK_TEST_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
        run: |
          uv run --no-sync pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test-results/junit.xml \
            --strict-markers

      - name: Build container image
        if: matrix.pg == '16'
        run: docker build -t rowback:ci .

      # Fail on any FIXABLE medium+ CVE or leaked secret in the shipped image. Unfixed Debian
      # CVEs are skipped: there is nothing to upgrade to yet, and the next rebuild picks them up.
      # Trivy runs from its image pinned by digest, not trivy-action (whose tags were hijacked in 2026).
      - name: Scan container image
        if: matrix.pg == '16'
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln,secret --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --exit-code 1 rowback:ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results-pg${{ matrix.pg }}
          path: test-results/junit.xml
          retention-days: 7

  core-without-enterprise:
    # Open-core promise: everything outside src/rowback/ee/ works on its own.
    name: Core tests without ee/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-groups
      - name: Remove Enterprise code and its tests, run the rest
        env:
          PYTHONPATH: src
        run: |
          rm -rf src/rowback/ee
          grep -rL "rowback\.ee" tests --include='test_*.py' | xargs uv run --no-sync pytest -q --strict-markers

  dependency-audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
      - run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --no-deps

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen --all-groups
      - run: uv run --no-sync ruff check src tests seatbelt

  sast:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
      # Fail on medium+ severity at medium+ confidence. Known-safe sites carry a
      # reasoned `# nosec <id>`; a bare noqa is not allowed (see CLAUDE.md).
      - run: uvx bandit -r src seatbelt --severity-level medium --confidence-level medium

  secrets:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every commit, not just the tip: a secret removed later is still public
      # Pinned by digest like trivy. Reviewed false positives (test-only and demo keys) live in
      # .gitleaksignore, each with its reason.
      - run: >
          docker run --rm -v "$PWD":/repo:ro
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts="--all" --no-banner --redact --exit-code 1
          --gitleaks-ignore-path /repo/.gitleaksignore
