# Push a tag like v0.2.0 (matching pyproject's version) to publish:
#   - the package to PyPI (trusted publishing: no token stored here; set it up once on pypi.org)
#   - the gateway image to ghcr.io/ege-usta/lomberk:<version> and :latest
#   - the server entry (server.json) to the MCP Registry, once PyPI has the package
#   - a GitHub release with generated notes
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test, build and smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.18"
          enable-cache: false   # never build a release from a cache a PR could have written
      # Every version check runs before anything is published, so a mismatch stops the whole release.
      - name: Tag must match the package version and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" = "$v"
          test "$(jq -r .version server.json)" = "$v" && test "$(jq -r '.packages[0].version' server.json)" = "$v"
      - run: uv sync --frozen --all-groups
      - name: Tests
        env:
          PYTHONPATH: src
          LOMBERK_TEST_PG_IMAGE: postgres:16-alpine
        run: uv run --no-sync pytest tests/ -q --strict-markers
      - run: uv build
      - name: The wheel installs and runs without the Pro extras
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/lomberk --help
          /tmp/smoke/bin/lomberk setup --help
          /tmp/smoke/bin/python -c "import lomberk.api, lomberk.server, lomberk.capture.install, lomberk.ee.panel, lomberk.ee.export"  # Solo works without the pro extra
          # stdio server without a database: one line on stderr and exit 1, never a traceback
          out=$(LOMBERK_CONFIG= /tmp/smoke/bin/lomberk serve 2>&1 </dev/null) && exit 1
          echo "$out"; echo "$out" | grep -q "Startup Refusal" && ! echo "$out" | grep -q Traceback
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push --all-tags "$image"

  mcp-registry:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the registry trusts this repo's OIDC token for io.github.ege-usta/*
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # The registry checks the package on PyPI, which can take a minute to show a new release.
      - name: Publish (retries while PyPI catches up)
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1

  github-release:
    needs: [pypi, image, mcp-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
