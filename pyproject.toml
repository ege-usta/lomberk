[project]
name = "undogate"
version = "0.1.0"
description = "Ctrl+Z for AI agents: an MCP gateway that makes every database write reversible."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "mcp>=1.3.0",
    "pglast>=6.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "slack-sdk>=3.44.1",
    "structlog>=25.1.0",
    "typer>=0.12.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
undogate = "undogate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undogate"]

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.127.3",
    "mypy>=1.15.0",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.4",
    "ruff>=0.9.9",
    "testcontainers>=4.9.1",
    "types-pyyaml>=6.0.12.20260906",
]
