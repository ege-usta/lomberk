[project]
name = "lomberk"
version = "0.2.0"
description = "Every agent write, reversible: an MCP gateway for PostgreSQL that blocks destructive SQL, holds risky writes for a person and can undo any applied write."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND Elastic-2.0"
license-files = ["LICENSE", "src/lomberk/ee/LICENSE"]
keywords = ["mcp", "postgres", "postgresql", "ai-agents", "undo", "sql-firewall", "approval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "mcp>=2.0.0",  # MCPServer (mcp.server.mcpserver) arrived in 2.0
    "pglast>=6.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.15.0",  # 2.15.0 fixes PYSEC-2026-4141 / -4183
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.1",  # 6.0 does not build on Python 3.12
    "slack-sdk>=3.44.1",
    "structlog>=25.1.0",
    "typer>=0.16.0",  # older typer breaks on click 8.2+
    "uvicorn>=0.53.0",
]

[project.urls]
Homepage = "https://ege-usta.github.io/lomberk/"
Source = "https://github.com/ege-usta/lomberk"
Issues = "https://github.com/ege-usta/lomberk/issues"
Security = "https://github.com/ege-usta/lomberk/security"

[project.scripts]
lomberk = "lomberk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lomberk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/SECURITY.md"]

[tool.ruff]
# Pin the ruleset so lint is deterministic and the project owns its own rules
# (ruff's ambient default pulls in opinionated families this code never opted into).
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# High-signal bug, import and modernization rules. Style rules that fight a
# deliberate design decision are off, each with a reason.
select = ["F", "E4", "E7", "E9", "W", "I", "B", "UP", "RUF", "PERF", "PIE", "T10"]
ignore = [
    "BLE001",  # blind `except` is deliberate: the seatbelt and sentinel fail closed and must never crash the caller
    "B008",    # FastAPI puts Depends()/Query() in argument defaults by design (see CLAUDE.md)
    "B023",    # loop-variable-in-closure false positives in parametrized tests
    "E701",    # this codebase deliberately uses terse single-line `if x: return y` statements
    "E702",    # same: a couple of intentional one-line compound statements
    "E731",    # assigning a lambda to a local name is fine and reads clearly here
    "E741",    # short names like `l`/`e` are fine in tight local scopes
    "RUF003",  # "ambiguous" unicode lives only in Turkish/prose comments, which is intentional
    "UP042",   # (str, Enum) is intentional; migrating to StrEnum would change str() output
    "RUF043",  # pytest.raises patterns in tests are intentional literal substrings
    "PERF401", # these are conditional appends in cold paths; a comprehension reads worse
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.127.3",
    "mypy>=1.15.0",
    "pytest-asyncio>=0.25.3",
    "pytest>=8.3.4",
    "ruff>=0.9.9",
    "testcontainers>=4.9.1",
    "types-pyyaml>=6.0.12.20260906",
]
