# Demo stack: a "production" Postgres, a one-shot installer, and the Rowback gateway.
# Agents connect to http://localhost:8000/mcp with the agent key ONLY.
# Replace every secret below before using this outside a laptop.
name: rowback
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pocketos
    ports:
      - "127.0.0.1:${ROWBACK_DEMO_DB_PORT:-5439}:5432"  # superuser test/test: never expose it beyond this machine
    volumes:
      - ./demo/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "pocketos"]
      interval: 2s
      retries: 30

  rowback-init:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      ROWBACK_INSTALL_DSN: postgresql://test:test@db:5432/pocketos
    command: >
      sh -c "rowback init --control-role rowback_control --agent-role rowback_agent &&
             rowback register public.payments --agent-role rowback_agent &&
             rowback register public.users --agent-role rowback_agent"
    restart: "no"

  gateway:
    build: .
    depends_on:
      rowback-init: { condition: service_completed_successfully }
    environment:
      ROWBACK_ADMIN_DSN: postgresql://rowback_control:control-demo@db:5432/pocketos
      ROWBACK_AGENT_DSN: postgresql://rowback_agent:agent-demo@db:5432/pocketos
      ROWBACK_API_KEY: ${ROWBACK_API_KEY:-demo-agent-key}
      ROWBACK_ADMIN_KEY: ${ROWBACK_ADMIN_KEY:-demo-admin-key}
      # The demo keys above are public, so the gateway only accepts them with this flag.
      # Outside a laptop: set real keys (openssl rand -hex 32) and remove this line.
      ROWBACK_ALLOW_WEAK_KEYS: "true"
    volumes:
      - ./rowback.yaml:/etc/rowback/rowback.yaml:ro
    ports:
      - "127.0.0.1:${ROWBACK_PORT:-8000}:8000"
    read_only: true
    tmpfs: ["/tmp", "/var/log/rowback:uid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
