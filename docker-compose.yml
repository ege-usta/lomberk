# Demo stack: a "production" Postgres, a one-shot installer, and the Lomberk gateway.
# Agents connect to http://localhost:8000/mcp with the agent key ONLY.
# Replace every secret below before using this outside a laptop.
name: lomberk
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pocketos
    ports:
      - "127.0.0.1:${LOMBERK_DEMO_DB_PORT:-5439}:5432"  # superuser test/test: never expose it beyond this machine
    volumes:
      - ./demo/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "pocketos"]
      interval: 2s
      retries: 30

  lomberk-init:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      LOMBERK_INSTALL_DSN: postgresql://test:test@db:5432/pocketos
    command: >
      sh -c "lomberk init --control-role lomberk_control --agent-role lomberk_agent &&
             lomberk register public.payments --agent-role lomberk_agent &&
             lomberk register public.users --agent-role lomberk_agent"
    restart: "no"

  gateway:
    build: .
    depends_on:
      lomberk-init: { condition: service_completed_successfully }
    environment:
      LOMBERK_ADMIN_DSN: postgresql://lomberk_control:control-demo@db:5432/pocketos
      LOMBERK_AGENT_DSN: postgresql://lomberk_agent:agent-demo@db:5432/pocketos
      LOMBERK_API_KEY: ${LOMBERK_API_KEY:-demo-agent-key}
      LOMBERK_ADMIN_KEY: ${LOMBERK_ADMIN_KEY:-demo-admin-key}
      # The demo keys above are public, so the gateway only accepts them with this flag.
      # Outside a laptop: set real keys (openssl rand -hex 32) and remove this line.
      LOMBERK_ALLOW_WEAK_KEYS: "true"
    volumes:
      - ./lomberk.yaml:/etc/lomberk/lomberk.yaml:ro
    ports:
      - "127.0.0.1:${LOMBERK_PORT:-8000}:8000"
    read_only: true
    tmpfs: ["/tmp", "/var/log/lomberk:uid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
