# Demo stack: a "production" Postgres, a one-shot installer, and the Undogate gateway.
# Agents connect to http://localhost:8000/mcp with the agent key ONLY.
# Replace every secret below before using this outside a laptop.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pocketos
    ports:
      - "${UNDOGATE_DEMO_DB_PORT:-5439}:5432"
    volumes:
      - ./demo/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "pocketos"]
      interval: 2s
      retries: 30

  undogate-init:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      UNDOGATE_INSTALL_DSN: postgresql://test:test@db:5432/pocketos
    command: >
      sh -c "undogate init --control-role undogate_control --agent-role undogate_agent &&
             undogate register public.payments --agent-role undogate_agent &&
             undogate register public.users --agent-role undogate_agent"
    restart: "no"

  gateway:
    build: .
    depends_on:
      undogate-init: { condition: service_completed_successfully }
    environment:
      UNDOGATE_ADMIN_DSN: postgresql://undogate_control:control-demo@db:5432/pocketos
      UNDOGATE_AGENT_DSN: postgresql://undogate_agent:agent-demo@db:5432/pocketos
      UNDOGATE_API_KEY: ${UNDOGATE_API_KEY:-demo-agent-key}
      UNDOGATE_ADMIN_KEY: ${UNDOGATE_ADMIN_KEY:-demo-admin-key}
    volumes:
      - ./undogate.yaml:/etc/undogate/undogate.yaml:ro
    ports:
      - "127.0.0.1:${UNDOGATE_PORT:-8000}:8000"
    read_only: true
    tmpfs: ["/tmp", "/var/log/undogate:uid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
